# Template configuration file

# Show information
show_name=[Show Name]
show_directory=../../[Animation|Television]/[Show Directory]

# Episodes per season (comma separated)
episodes_per_season=12,12

# Allow scraper to update episodes_per_season
allow_episodes_per_season_update=[false/true]

# Alternative show names (for matching files with different naming)
# Comma separated list of alternative names that might appear in filenames
alt_names=

# Boolean on whether to skip scrapping
skip_scraping=[false/true]

# Scraper URL for episode information (optional)
scraper_url=

# Advanced features (enables enhanced formatting and numbering)
advanced_features=[false/true]

# The following optinos require advanced features to be enabled
# Additional URL for extra episode information (optional)
additional_url=

# Episode number digit formatting
episode_digit_count=2

# Include total episode count in formatting
include_total_episode=[false/true]
overall_episode_digit_count=3

# Advanced scraping configuration
# Limit number of tables pulled after heading (0 = no limit, >0 = limit to that many tables)
# Useful for pages with many tables when you only want the first few
max_tables_after_heading=0

# Custom formatting option
# display_name – your computed display name
# season – integer season number (locked at :02)
# episode_str – your already-built episode string (handles 10.5, etc.)
# overall_episode – raw overall number
# overall_str – overall number padded with overall_digit_count
# episode_title – the title (use your existing sanitization after formatting)
custom_format={display_name} - Ep {overall_episode} (S{season}E{episode_str}) - {episode_title}

extra_headings=[false/true]
extra_headings_list=[]